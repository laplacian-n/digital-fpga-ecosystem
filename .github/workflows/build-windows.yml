name: Build Windows app

# Push a tag like v0.1.0 -> builds FPGAEcosystem-Setup-<ver>.exe + a portable zip
# and attaches both to a GitHub Release. "Run workflow" builds without releasing
# (download from the run's Artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # release.yml calls this after tagging a new VERSION on main (a tag pushed with GITHUB_TOKEN does not
  # start workflows by itself)
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke-test the launcher server
        shell: pwsh
        run: |
          $env:APPDATA = "$env:RUNNER_TEMP\appdata"
          $log = "$env:RUNNER_TEMP\launcher"
          $p = Start-Process python -ArgumentList "launcher\app.py","--no-open","--port","18770" -PassThru `
                 -RedirectStandardOutput "$log.out" -RedirectStandardError "$log.err"
          # a cold runner can take well over 4 s to import the backend — wait for the port, up to 60 s
          $up = $false
          for ($i = 0; $i -lt 120 -and -not $up; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:18770/api/info -TimeoutSec 2 | Out-Null; $up = $true }
            catch { if ($p.HasExited) { break }; Start-Sleep -Milliseconds 500 }
          }
          if (-not $up) {
            Get-Content "$log.out","$log.err" -ErrorAction SilentlyContinue
            throw "launcher did not start (exited: $($p.HasExited))"
          }
          $s = Invoke-RestMethod http://127.0.0.1:18770/api/status
          if (-not $s.backend) { throw "backend failed: $($s.backend_error)" }
          $r = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:18770/chat -Body '{"message":"full adder"}'
          if ($r.status -ne "VERIFIED") { throw "chat failed: $($r | ConvertTo-Json -Depth 3)" }
          Stop-Process $p.Id

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $app = (Select-String -Path launcher\app.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          $tag = "${{ inputs.tag }}"
          if (-not $tag -and "${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          if ($tag) {
            $v = $tag.TrimStart("v")
            # the app compares its VERSION with the release tag to offer updates — they must match
            if ($v -ne $app) { throw "tag v$v does not match VERSION = `"$app`" in launcher/app.py — bump VERSION first" }
          } else { $v = $app }
          "v=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File launcher\build_windows.ps1 -Version ${{ steps.ver.outputs.v }}

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\FPGAEcosystem -DestinationPath dist\FPGAEcosystem-Portable-${{ steps.ver.outputs.v }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FPGAEcosystem-${{ steps.ver.outputs.v }}
          path: |
            dist/FPGAEcosystem-Setup-*.exe
            dist/FPGAEcosystem-Portable-*.zip

      - name: Release
        if: steps.ver.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            dist/FPGAEcosystem-Setup-*.exe
            dist/FPGAEcosystem-Portable-*.zip
